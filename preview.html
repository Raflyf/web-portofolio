<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratinjau Dokumen Sertifikat — Rafly Firmansyah</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='monospace' fill='%2310b981'>R</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=2.3.0">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-ink);
      font-family: var(--font-body);
    }

    /* Top Sticky Navigation Bar */
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1.25rem;
      background-color: var(--surface-overlay);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-card);
      z-index: 100;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .preview-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      overflow: hidden;
      min-width: 180px;
      flex: 1;
    }

    .preview-tag {
      font-family: var(--font-mono);
      font-size: var(--fs-caption);
      padding: 0.2rem 0.55rem;
      background-color: var(--accent-emerald-dim);
      border: 1px solid var(--accent-emerald);
      color: var(--accent-emerald);
      border-radius: var(--radius-sm);
      white-space: nowrap;
      font-weight: 700;
    }

    .preview-title {
      font-size: var(--fs-body);
      font-weight: 700;
      color: var(--text-heading);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Toolbar Actions */
    .preview-toolbar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .page-indicator {
      font-family: var(--font-mono);
      font-size: var(--fs-caption);
      color: var(--accent-emerald);
      background-color: var(--surface-card);
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-card);
      white-space: nowrap;
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-md);
      background-color: var(--surface-card);
      border: 1px solid var(--border-card);
      color: var(--text-ink);
      font-size: var(--fs-body-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-smooth-out);
      text-decoration: none;
    }

    .toolbar-btn:hover {
      background-color: var(--surface-card-hover);
      border-color: var(--accent-emerald);
      color: var(--accent-emerald);
      transform: translateY(-1px);
    }

    .toolbar-btn--primary {
      background-color: var(--accent-emerald);
      color: oklch(0.12 0.02 250);
      font-weight: 700;
      border: none;
    }

    .toolbar-btn--primary:hover {
      background-color: var(--accent-emerald);
      color: oklch(0.08 0.02 250);
      box-shadow: 0 0 12px var(--accent-emerald-glow);
    }

    /* Main Scrollable Canvas Viewport */
    .preview-viewport {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      background-color: oklch(0.08 0.01 250);
      overflow-y: auto;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      box-sizing: border-box;
      gap: 2rem;
      -webkit-overflow-scrolling: touch;
    }

    .pages-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 1000px;
    }

    .cert-page-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0.5rem;
    }

    .page-label-tag {
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      background-color: var(--surface-card);
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    .cert-image-frame {
      position: relative;
      width: 100%;
      background-color: #ffffff;
      border-radius: var(--radius-sm);
      box-shadow: 0 20px 48px oklch(0 0 0 / 0.7), 0 0 1px oklch(1 1 1 / 0.3);
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .cert-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Loading Spinner */
    .preview-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: auto;
      padding: 2rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-body-sm);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-card);
      border-top-color: var(--accent-emerald);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .preview-header {
        padding: 0.5rem 0.75rem;
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }
      .preview-title-wrap {
        width: 100%;
      }
      .preview-toolbar {
        width: 100%;
        justify-content: space-between;
      }
      .preview-viewport {
        padding: 1rem 0.5rem;
        height: calc(100vh - 95px);
      }
      .pages-wrapper {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <header class="preview-header">
    <div class="preview-title-wrap">
      <span class="preview-tag">DOKUMEN RESMI</span>
      <h1 class="preview-title" id="doc-title">Memuat Sertifikat...</h1>
    </div>

    <div class="preview-toolbar">
      <span id="page-badge" class="page-indicator" style="display: none;">1 Halaman</span>

      <button type="button" id="zoom-out-btn" class="toolbar-btn" title="Perkecil">
        <span>&minus; Zoom</span>
      </button>

      <button type="button" id="zoom-in-btn" class="toolbar-btn" title="Perbesar">
        <span>+ Zoom</span>
      </button>

      <button type="button" id="fit-width-btn" class="toolbar-btn" title="Sesuaikan Layar">
        <span>Reset</span>
      </button>

      <a id="download-btn" href="#" download class="toolbar-btn" title="Unduh Berkas PDF Asli">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>Unduh PDF</span>
      </a>

      <a href="index.html#certificates" class="toolbar-btn toolbar-btn--primary" title="Kembali ke Portofolio">
        <span>Tutup &times;</span>
      </a>
    </div>
  </header>

  <main class="preview-viewport" id="preview-viewport">
    <div id="loader" class="preview-loader">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loader-text">Menyiapkan Dokumen Sertifikat...</p>
    </div>

    <div id="pages-container" class="pages-wrapper" style="display: none;">
      <!-- Multi-page blocks dynamically rendered here -->
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const rawImgs = urlParams.get('imgs');
      const rawImg = urlParams.get('img');
      const rawPdf = urlParams.get('pdf') || urlParams.get('file');
      const docTitle = urlParams.get('title') || 'Dokumen Sertifikat';

      const titleEl = document.getElementById('doc-title');
      const loaderEl = document.getElementById('loader');
      const pagesContainer = document.getElementById('pages-container');
      const pageBadge = document.getElementById('page-badge');
      const downloadBtn = document.getElementById('download-btn');
      const zoomInBtn = document.getElementById('zoom-in-btn');
      const zoomOutBtn = document.getElementById('zoom-out-btn');
      const fitWidthBtn = document.getElementById('fit-width-btn');

      if (titleEl) titleEl.textContent = docTitle;
      document.title = `${docTitle} — Rafly Firmansyah`;

      // Determine images array
      let imagesList = [];
      if (rawImgs) {
        imagesList = rawImgs.split(',').map(s => s.trim()).filter(Boolean);
      } else if (rawImg) {
        imagesList = [rawImg];
      } else if (rawPdf) {
        const base = rawPdf.replace(/^certificates\//, '').replace(/\.pdf$/, '');
        if (base === 'google-profil-bisnis-ecommerce-kominfo') {
          imagesList = [
            'certificates/images/google-profil-bisnis-ecommerce-kominfo-1.png',
            'certificates/images/google-profil-bisnis-ecommerce-kominfo-2.png'
          ];
        } else {
          imagesList = [`certificates/images/${base}.png`];
        }
      }

      if (rawPdf) {
        downloadBtn.href = rawPdf;
      } else if (imagesList.length > 0) {
        downloadBtn.href = imagesList[0];
      }

      if (imagesList.length === 0) {
        loaderEl.innerHTML = '<p style="color:var(--accent-amber);">Berkas dokumen tidak ditemukan.</p>';
        return;
      }

      // Render all pages
      if (imagesList.length > 1) {
        pageBadge.textContent = `Dokumen ${imagesList.length} Halaman`;
        pageBadge.style.display = 'inline-flex';
      }

      pagesContainer.innerHTML = '';
      imagesList.forEach((src, idx) => {
        const pageBlock = document.createElement('div');
        pageBlock.className = 'cert-page-block';

        if (imagesList.length > 1) {
          const label = document.createElement('span');
          label.className = 'page-label-tag';
          label.textContent = `Halaman ${idx + 1} dari ${imagesList.length}`;
          pageBlock.appendChild(label);
        }

        const frame = document.createElement('div');
        frame.className = 'cert-image-frame';

        const img = document.createElement('img');
        img.className = 'cert-image';
        img.src = src;
        img.alt = `${docTitle} - Halaman ${idx + 1}`;
        img.loading = 'eager';

        frame.appendChild(img);
        pageBlock.appendChild(frame);
        pagesContainer.appendChild(pageBlock);
      });

      loaderEl.style.display = 'none';
      pagesContainer.style.display = 'flex';

      // Zoom Controls
      let zoomLevel = 1.0;

      function updateZoom() {
        if (zoomLevel === 1.0) {
          pagesContainer.style.maxWidth = '1000px';
          pagesContainer.style.width = '100%';
        } else {
          pagesContainer.style.maxWidth = 'none';
          pagesContainer.style.width = `${Math.round(1000 * zoomLevel)}px`;
        }
      }

      zoomInBtn.addEventListener('click', () => {
        zoomLevel = Math.min(2.5, zoomLevel + 0.25);
        updateZoom();
      });

      zoomOutBtn.addEventListener('click', () => {
        zoomLevel = Math.max(0.5, zoomLevel - 0.25);
        updateZoom();
      });

      fitWidthBtn.addEventListener('click', () => {
        zoomLevel = 1.0;
        pagesContainer.style.maxWidth = '1000px';
        pagesContainer.style.width = '100%';
      });
    });
  </script>
</body>
</html>
